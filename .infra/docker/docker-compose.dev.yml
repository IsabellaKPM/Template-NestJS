services:
  api:
    build:
      context: ../../
      dockerfile: .infra/docker/Dockerfile
      target: development

    container_name: backend-api

    ports:
      - "${PORT:-3001}:3001"

    volumes:
      - ../../:/app
      - node_modules:/app/node_modules

    env_file:
      - ../../.env.development

    command: sh -c "yarn db:setup && yarn start:dev"

    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:15-alpine

    container_name: postgres_db

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    env_file:
      - ../../.env.development

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    healthcheck:
      test: ["CMD-SHELL", "psql -U ${DB_USER} -d ${DB_NAME} -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  node_modules:
  postgres_data: